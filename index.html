<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Святик Комбат</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1c1f24;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Верхние блоки со статистикой */
        .top-stats {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .stat-box {
            flex: 1;
            background-color: #2c2d35;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stat-title {
            font-size: 12px;
            color: #d4a46a;
            margin-bottom: 5px;
        }
        .stat-box:nth-child(2) .stat-title {
            color: #8db55b;
        }
        .stat-value {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Иконка монетки */
        .coin-icon {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.6), 0 0 5px rgba(243,156,18,0.5);
        }

        /* Главный баланс */
        .main-balance {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 54px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .main-balance .coin-icon {
            width: 55px;
            height: 55px;
            font-size: 34px;
        }

        /* Полоса уровня */
        .level-container {
            margin-bottom: 40px;
        }
        .level-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .level-text span:last-child {
            color: #a0a0a0;
        }
        .progress-bg {
            background-color: #333642;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .progress-fill {
            background: linear-gradient(90deg, #89e130, #b2ff4d);
            width: 42%;
            height: 100%;
            border-radius: 7px;
        }

        /* Зона персонажа (Святика) */
        .character-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Синий круг на фоне */
        .character-ring {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(43, 62, 172, 0.9) 0%, rgba(26, 32, 60, 0.9) 70%);
            border: 15px solid #20232c;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Сама картинка */
        .character-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.05s ease;
            touch-action: manipulation;
        }
        /* Анимация при нажатии */
        .character-img:active {
            transform: scale(0.92);
        }

        /* Вылетающий текст +1 */
        .floating-text {
            position: absolute;
            color: white;
            font-size: 40px;
            font-weight: 800;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 3px 6px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(1.3);
            }
        }

        /* Нижний интерфейс (Энергия и меню) */
        .bottom-hud {
            margin-top: auto;
        }
        .energy-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .lightning {
            color: #f1c40f;
            font-size: 24px;
        }

        /* Навигация внизу */
        .navigation {
            display: flex;
            background-color: #272a33;
            border-radius: 18px;
            padding: 8px;
            justify-content: space-between;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            font-size: 12px;
            font-weight: 600;
            color: #8c8e96;
            border-radius: 14px;
        }
        .nav-item.active {
            background-color: #1a1c22;
            color: white;
        }
        .nav-icon {
            font-size: 22px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<!-- Аудио с фоновой музыкой (загрузит твой music.mp3) -->
<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<div class="app-container">
    
    <!-- Шапка со статками -->
    <div class="top-stats">
        <div class="stat-box">
            <div class="stat-title">Прибыль за тап</div>
            <div class="stat-value"><div class="coin-icon">$</div> +1</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Прибыль в сек.</div>
            <div class="stat-value"><div class="coin-icon">$</div> 0</div>
        </div>
    </div>

    <!-- Общий баланс -->
    <div class="main-balance">
        <div class="coin-icon">$</div>
        <span id="score">42</span>
    </div>

    <!-- Прогресс бар уровня -->
    <div class="level-container">
        <div class="level-text">
            <span>Начальный</span>
            <span>Уровень 1/10</span>
        </div>
        <div class="progress-bg">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Зона клика по Святику -->
    <div class="character-area">
        <div class="character-ring">
            <!-- Картинка Святика (загрузит твой svyatik.png) -->
            <img src="svyatik.png" alt="Святик" class="character-img" id="svyatik-btn" draggable="false">
        </div>
    </div>

    <!-- Нижняя часть -->
    <div class="bottom-hud">
        <div class="energy-bar">
            <span class="lightning">⚡</span>
            <span id="energy">100/100</span>
        </div>
        
        <div class="navigation">
            <div class="nav-item active">
                <div class="nav-icon">👆</div>
                Доход за тап
            </div>
            <div class="nav-item">
                <div class="nav-icon">⛏️</div>
                Доход в сек.
            </div>
            <div class="nav-item">
                <div class="nav-icon">🪙</div>
                Аирдроп
            </div>
        </div>
    </div>

</div>

<script>
    let score = 42;          // Стартовый баланс как на скрине
    let energy = 100;        // Текущая энергия
    const maxEnergy = 100;   // Максимальная энергия
    let musicStarted = false;

    const scoreElement = document.getElementById('score');
    const energyElement = document.getElementById('energy');
    const svyatikBtn = document.getElementById('svyatik-btn');
    const bgMusic = document.getElementById('bg-music');

    // Функция обработки клика по Святику (срабатывает быстро и поддерживает телефоны)
    svyatikBtn.addEventListener('pointerdown', function(e) {
        // При первом клике запускаем музыку
        if (!musicStarted) {
            bgMusic.play().catch(err => console.log("Музыка не найдена, либо заблокирована браузером"));
            musicStarted = true;
        }

        // Если есть энергия — зачисляем монеты
        if (energy > 0) {
            score++;
            energy--;
            
            // Обновляем цифры на экране
            scoreElement.innerText = score;
            energyElement.innerText = `${energy}/${maxEnergy}`;

            // Рисуем вылетающую +1
            showFloatingText(e);
            
            // Если играем с телефона, добавляем легкую вибрацию
            if (navigator.vibrate) {
                navigator.vibrate(40);
            }
        }
    });

    // Функция создания красивой вылетающей цифры +1
    function showFloatingText(e) {
        const floatDiv = document.createElement('div');
        floatDiv.classList.add('floating-text');
        floatDiv.innerText = '+1';

        // Определяем место клика
        let x = e.clientX;
        let y = e.clientY;
        
        // Корректируем координаты, чтобы текст летел прямо из-под пальца/курсора
        floatDiv.style.left = `${x - 20}px`;
        floatDiv.style.top = `${y - 40}px`;

        document.body.appendChild(floatDiv);

        // Удаляем цифру из памяти после того, как анимация закончилась
        setTimeout(() => {
            floatDiv.remove();
        }, 1000);
    }

    // Автоматическое восстановление энергии (1 энергия в секунду)
    setInterval(() => {
        if (energy < maxEnergy) {
            energy++;
            energyElement.innerText = `${energy}/${maxEnergy}`;
        }
    }, 1000);
</script>

</body>
</html>
